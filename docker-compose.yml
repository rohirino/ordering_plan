services:
  db:
    image: postgres:16
    container_name: ordering_plan_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordering_plan}
      POSTGRES_USER: ${POSTGRES_USER:-ordering_plan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordering_plan_local}
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordering_plan} -d ${POSTGRES_DB:-ordering_plan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: ordering_plan_container
    # ★重要：iMacのフォルダとDockerの中を繋ぐことで、データ（db.sqlite3）をそのまま引き継ぎます
    volumes:
      - .:/app
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ordering_plan}
      POSTGRES_USER: ${POSTGRES_USER:-ordering_plan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordering_plan_local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data:
